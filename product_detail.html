<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Detail - ShopHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">

    <div class="container mx-auto px-4 py-12">
        <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-12 p-8">
                
                <!-- Product Images -->
                <div class="space-y-4">
                    <div class="aspect-square bg-gray-100 rounded-2xl overflow-hidden">
                        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=80" 
                             alt="Product Image" class="w-full h-full object-cover">
                    </div>
                    <div class="grid grid-cols-4 gap-4">
                        <div class="aspect-square border-2 border-purple-600 rounded-lg overflow-hidden cursor-pointer">
                            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=200&q=80" class="w-full h-full object-cover">
                        </div>
                        <!-- Additional thumbnails go here -->
                    </div>
                </div>

                <!-- Product Info -->
                <div class="flex flex-col justify-center">
                    <nav class="flex text-sm text-gray-500 mb-4 gap-2">
                        <a href="home.html" class="hover:text-purple-600">Home</a> / 
                        <a href="Men.html" class="hover:text-purple-600">Footwear</a>
                    </nav>

                    <h1 class="text-4xl font-bold text-gray-900 mb-2">Classic Performance Sneakers</h1>
                    <div class="flex items-center gap-4 mb-6">
                        <div class="flex text-yellow-400 text-sm">
                            <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star-half-alt"></i>
                        </div>
                        <span class="text-gray-500 text-sm">(124 Reviews)</span>
                    </div>

                    <div class="mb-8">
                        <span class="text-3xl font-extrabold text-purple-700">$89.00</span>
                        <span class="ml-3 text-lg text-gray-400 line-through">$120.00</span>
                    </div>

                    <p class="text-gray-600 mb-8 leading-relaxed">
                        Engineered for comfort and designed for style. These sneakers feature a breathable mesh upper 
                        and high-rebound cushioning for all-day performance.
                    </p>

                    <!-- Selection Options -->
                    <div class="space-y-6 mb-8">
                        <div>
                            <span class="block text-sm font-bold text-gray-700 mb-3">Select Size</span>
                            <div class="flex gap-3">
                                <button class="w-12 h-12 border-2 rounded-lg flex items-center justify-center hover:border-purple-600 transition">8</button>
                                <button class="w-12 h-12 border-2 border-purple-600 rounded-lg flex items-center justify-center bg-purple-50 text-purple-700 font-bold">9</button>
                                <button class="w-12 h-12 border-2 rounded-lg flex items-center justify-center hover:border-purple-600 transition">10</button>
                            </div>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="flex gap-4">
                        <button class="flex-grow bg-purple-600 text-white py-4 rounded-xl font-bold hover:bg-purple-700 transition shadow-lg shadow-purple-200">
                            Add to Cart
                        </button>
                        <button class="w-14 border border-gray-200 rounded-xl hover:bg-red-50 hover:text-red-500 transition">
                            <i class="far fa-heart"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
