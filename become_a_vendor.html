<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Onboarding | ShopHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Ensures steps are hidden by default via utility classes */
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-lg border border-gray-100">
        <div class="mb-8">
            <div class="w-full bg-gray-200 h-2 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-purple-600 h-2 rounded-full transition-all duration-500" style="width: 33%;"></div>
            </div>
            <p id="progress-text" class="text-xs text-gray-400 mt-2 text-center">Step 1 of 3</p>
        </div>

        <div id="step-login" class="onboarding-step">
            <h2 class="text-2xl font-bold text-gray-800">Login as Vendor</h2>
            <p class="text-gray-500 text-sm mt-1">Enter your phone number to continue</p>
            <input type="tel" id="phone" placeholder="+91 00000 00000" class="w-full border border-gray-300 p-3 mt-4 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
            <button onclick="showStep('step-otp', '66%', 'Step 2 of 3')" class="bg-purple-600 text-white w-full py-3 mt-6 rounded-lg font-bold hover:bg-purple-700 transition">Continue</button>
        </div>

        <div id="step-otp" class="onboarding-step hidden">
            <h2 class="text-2xl font-bold text-gray-800">Verify Phone</h2>
            <p class="text-gray-500 text-sm mt-1">We sent an OTP to your registered mobile</p>
            <input type="text" placeholder="Enter 6-digit OTP" class="w-full border border-gray-300 p-3 mt-4 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
            <button onclick="showStep('step-onboarding', '100%', 'Step 3 of 3')" class="bg-purple-600 text-white w-full py-3 mt-6 rounded-lg font-bold hover:bg-purple-700 transition">Verify & Continue</button>
        </div>

        <div id="step-onboarding" class="onboarding-step hidden">
            <h2 class="text-2xl font-bold text-gray-800">Business Details</h2>
            <p class="text-gray-500 text-sm mt-1">Almost there! Complete your KYC</p>
            <input type="text" id="gstin" placeholder="Enter GSTIN" class="w-full border border-gray-300 p-3 mt-4 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
            <input type="text" id="fullname" placeholder="Full Name" class="w-full border border-gray-300 p-3 mt-4 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
            <button onclick="completeOnboarding()" class="bg-green-600 text-white w-full py-3 mt-6 rounded-lg font-bold hover:bg-green-700 transition">Save & Submit</button>
        </div>
    </div>

   <script>
    function showStep(stepId, progressWidth, progressText) {
        document.querySelectorAll('.onboarding-step').forEach(s => s.classList.add('hidden'));
        document.getElementById(stepId).classList.remove('hidden');
        document.getElementById('progress-bar').style.width = progressWidth;
        document.getElementById('progress-text').innerText = progressText;
    }

    function completeOnboarding() {
        const fullName = document.getElementById('fullname').value;
        
        // 1. Save the name to localStorage so the dashboard can read it
        localStorage.setItem('vendorName', fullName); 
        
        // 2. Redirect to the dashboard
        window.location.href = "vendor_dashboard.html";
    }
</script>
</body>
</html>
