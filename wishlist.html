<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wishlist | ShopHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #fdf8f3;
      --warm: #f5ece0;
      --blush: #f2c4b0;
      --rose: #e07a5f;
      --burgundy: #9b2335;
      --plum: #6b2d5e;
      --ink: #1c1917;
      --muted: #78716c;
      --purple: #7c3aed;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
    }

    /* Header */
    header {
      background: white;
      border-bottom: 1px solid #e8ddd5;
      position: sticky; top: 0; z-index: 50;
    }
    .header-inner {
      max-width: 1200px; margin: 0 auto;
      padding: 14px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--purple); text-decoration: none; display: flex; align-items: center; gap: 8px; }
    .header-nav { display: flex; align-items: center; gap: 20px; }
    .header-nav a { font-size: 14px; color: var(--muted); text-decoration: none; font-weight: 500; transition: color 0.2s; }
    .header-nav a:hover { color: var(--purple); }
    .cart-icon { position: relative; }
    .cart-badge { position: absolute; top: -8px; right: -8px; background: var(--purple); color: white; font-size: 10px; border-radius: 999px; height: 16px; width: 16px; display: flex; align-items: center; justify-content: center; font-weight: 700; }

    /* Hero Banner */
    .wishlist-hero {
      background: linear-gradient(135deg, #f5ece0 0%, #fde8e4 50%, #e8daf5 100%);
      padding: 48px 24px 36px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .wishlist-hero::before {
      content: '♥ ♡ ♥ ♡ ♥ ♡ ♥ ♡ ♥ ♡ ♥ ♡ ♥ ♡ ♥ ♡';
      position: absolute; top: 10px; left: 0; right: 0;
      font-size: 12px; letter-spacing: 8px; color: rgba(224,122,95,0.15);
      white-space: nowrap; overflow: hidden;
    }
    .hero-title {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(32px, 5vw, 52px);
      color: var(--ink);
      line-height: 1.1;
      margin-bottom: 8px;
    }
    .hero-title em { color: var(--rose); font-style: italic; }
    .hero-subtitle { color: var(--muted); font-size: 15px; font-weight: 400; }
    .hero-count {
      display: inline-block; margin-top: 16px;
      background: white; border: 1px solid #e8ddd5;
      border-radius: 999px; padding: 6px 18px;
      font-size: 13px; font-weight: 600; color: var(--plum);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    /* Controls Bar */
    .controls-bar {
      max-width: 1200px; margin: 0 auto;
      padding: 20px 24px;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
    }
    .filter-chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      border: 1.5px solid #e5ddd6; border-radius: 999px;
      padding: 6px 16px; font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all 0.15s; color: var(--muted);
      background: white;
    }
    .chip:hover { border-color: var(--rose); color: var(--rose); }
    .chip.active { background: var(--rose); color: white; border-color: var(--rose); }
    .sort-select {
      border: 1.5px solid #e5ddd6; border-radius: 10px;
      padding: 8px 14px; font-size: 13px; font-weight: 500;
      outline: none; background: white; color: var(--ink);
      cursor: pointer;
    }
    .sort-select:focus { border-color: var(--rose); }

    /* Grid */
    .grid-container { max-width: 1200px; margin: 0 auto; padding: 0 24px 60px; }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }

    /* Product Card */
    .product-card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid #ede8e3;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      animation: fadeUp 0.4s ease both;
    }
    .product-card:hover { transform: translateY(-5px); box-shadow: 0 16px 40px rgba(0,0,0,0.1); }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-image-wrap {
      position: relative; overflow: hidden;
      aspect-ratio: 4/5; background: #f5ece0;
    }
    .card-image-wrap img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.4s ease;
    }
    .product-card:hover .card-image-wrap img { transform: scale(1.06); }

    .card-badge {
      position: absolute; top: 12px; left: 12px;
      background: var(--rose); color: white;
      font-size: 11px; font-weight: 700;
      padding: 3px 10px; border-radius: 999px;
    }
    .card-badge.new { background: var(--plum); }

    .heart-btn {
      position: absolute; top: 12px; right: 12px;
      width: 36px; height: 36px; border-radius: 50%;
      background: white; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      transition: transform 0.2s, background 0.2s;
      color: var(--rose); font-size: 16px;
    }
    .heart-btn:hover { transform: scale(1.15); background: #fff5f3; }
    .heart-btn.removing { animation: heartPop 0.3s ease; }
    @keyframes heartPop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.4); }
      100% { transform: scale(0); opacity: 0; }
    }

    .quick-add {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(28,25,23,0.85); backdrop-filter: blur(4px);
      color: white; text-align: center; padding: 12px;
      font-size: 13px; font-weight: 600; letter-spacing: 0.5px;
      transform: translateY(100%); transition: transform 0.25s ease;
      cursor: pointer; border: none; width: 100%;
    }
    .product-card:hover .quick-add { transform: translateY(0); }
    .quick-add:hover { background: rgba(124,58,237,0.9); }

    .card-body { padding: 14px 16px 16px; }
    .card-category { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .card-name { font-family: 'DM Serif Display', serif; font-size: 16px; color: var(--ink); line-height: 1.3; margin-bottom: 8px; }
    .card-price-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .card-price { font-size: 16px; font-weight: 700; color: var(--ink); }
    .card-mrp { font-size: 13px; color: var(--muted); text-decoration: line-through; }
    .card-discount { font-size: 12px; font-weight: 700; color: #16a34a; }
    .add-to-cart-btn {
      width: 100%; padding: 10px;
      background: var(--ink); color: white;
      border: none; border-radius: 10px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      display: flex; align-items: center; justify-content: center; gap-6px;
    }
    .add-to-cart-btn:hover { background: var(--purple); transform: scale(1.02); }
    .add-to-cart-btn.added { background: #16a34a; }

    /* Empty State */
    .empty-state {
      text-align: center; padding: 80px 20px;
      display: none;
    }
    .empty-icon {
      font-size: 72px; margin-bottom: 16px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .empty-title { font-family: 'DM Serif Display', serif; font-size: 28px; color: var(--ink); margin-bottom: 8px; }
    .empty-sub { color: var(--muted); font-size: 15px; margin-bottom: 28px; }
    .shop-btn {
      display: inline-block;
      background: var(--rose); color: white;
      padding: 14px 32px; border-radius: 12px;
      font-weight: 700; font-size: 14px; text-decoration: none;
      transition: background 0.2s, transform 0.15s;
    }
    .shop-btn:hover { background: var(--burgundy); transform: scale(1.02); }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--ink); color: white;
      padding: 12px 24px; border-radius: 12px;
      font-size: 14px; font-weight: 500;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      transition: transform 0.3s ease, opacity 0.3s;
      opacity: 0; z-index: 999; white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* Share / clear bar */
    .action-bar {
      max-width: 1200px; margin: 0 auto;
      padding: 0 24px 16px;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    }
    .action-bar-info { font-size: 13px; color: var(--muted); }
    .action-bar-btns { display: flex; gap: 8px; }
    .outline-btn {
      border: 1.5px solid #e5ddd6; border-radius: 10px;
      padding: 8px 16px; font-size: 13px; font-weight: 600;
      background: white; color: var(--ink); cursor: pointer;
      transition: all 0.15s;
    }
    .outline-btn:hover { border-color: var(--rose); color: var(--rose); }
    .outline-btn.danger:hover { border-color: #ef4444; color: #ef4444; }

    @media (max-width: 600px) {
      .hero-title { font-size: 30px; }
      .product-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .card-name { font-size: 14px; }
    }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="header-inner">
    <a href="home.html" class="logo"><i class="fas fa-shopping-bag" style="font-size:18px"></i> ShopHub</a>
    <nav class="header-nav">
      <a href="order-history.html"><i class="fas fa-box" style="margin-right:4px"></i>Orders</a>
      <a href="profile.html"><i class="fas fa-user" style="margin-right:4px"></i>Profile</a>
      <a href="cart.html" class="cart-icon">
        <i class="fas fa-shopping-cart" style="font-size:20px; color:var(--muted)"></i>
        <span class="cart-badge" id="cart-badge">0</span>
      </a>
    </nav>
  </div>
</header>

<!-- Hero -->
<div class="wishlist-hero">
  <h1 class="hero-title">Things I <em>love</em></h1>
  <p class="hero-subtitle">Your curated collection of favourites</p>
  <div class="hero-count" id="hero-count">0 items saved</div>
</div>

<!-- Controls -->
<div class="controls-bar">
  <div class="filter-chips" id="filter-chips">
    <button class="chip active" onclick="setFilter('all', this)">All</button>
    <button class="chip" onclick="setFilter('Men', this)">Men</button>
    <button class="chip" onclick="setFilter('Women', this)">Women</button>
    <button class="chip" onclick="setFilter('Kids', this)">Kids</button>
    <button class="chip" onclick="setFilter('Electronics', this)">Electronics</button>
    <button class="chip" onclick="setFilter('Jewellery', this)">Jewellery</button>
    <button class="chip" onclick="setFilter('Footwear', this)">Footwear</button>
  </div>
  <select class="sort-select" id="sort-select" onchange="renderWishlist()">
    <option value="recent">Recently Added</option>
    <option value="price-asc">Price: Low to High</option>
    <option value="price-desc">Price: High to Low</option>
    <option value="name">Name A–Z</option>
  </select>
</div>

<!-- Action Bar -->
<div class="action-bar" id="action-bar" style="display:none">
  <p class="action-bar-info" id="action-bar-info"></p>
  <div class="action-bar-btns">
    <button class="outline-btn" onclick="addAllToCart()"><i class="fas fa-cart-plus" style="margin-right:6px"></i>Add All to Cart</button>
    <button class="outline-btn danger" onclick="clearWishlist()"><i class="fas fa-trash" style="margin-right:6px"></i>Clear All</button>
  </div>
</div>

<!-- Grid -->
<div class="grid-container">
  <div class="product-grid" id="product-grid"></div>
  <div class="empty-state" id="empty-state">
    <div class="empty-icon">🤍</div>
    <h2 class="empty-title">Your wishlist is empty</h2>
    <p class="empty-sub">Save items you love by tapping the heart on any product.</p>
    <a href="home.html" class="shop-btn">Discover Products</a>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  // ─── Seed Data ─────────────────────────────────────────────────────────────
  // Pre-populate wishlist with sample items if empty, so the page looks great.
  const SAMPLE_WISHLIST = [
    { id:'s1', name:'Classic White Shirt', price:699, mrp:999, category:'Men', image:'https://images.unsplash.com/photo-1598300042247-d088f8ab3a91?w=400&q=80', page:'shirts.html', badge:'', addedAt: Date.now()-1000 },
    { id:'j1', name:'Leather Biker Jacket', price:2499, mrp:3499, category:'Men', image:'https://images.unsplash.com/photo-1551028719-00167b16eac5?w=400&q=80', page:'jackets.html', badge:'Hot', addedAt: Date.now()-2000 },
    { id:'w1', name:'Floral Summer Dress', price:1299, mrp:1799, category:'Women', image:'https://images.unsplash.com/photo-1496747611176-843222e1e57c?w=400&q=80', page:'women.html', badge:'New', addedAt: Date.now()-3000 },
    { id:'e2', name:'Wireless Earbuds Pro', price:1999, mrp:2999, category:'Electronics', image:'https://images.unsplash.com/photo-1606220945770-b5b6c2c55bf1?w=400&q=80', page:'earpods.html', badge:'', addedAt: Date.now()-4000 },
    { id:'jw1', name:'Gold Necklace Set', price:4999, mrp:6500, category:'Jewellery', image:'https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?w=400&q=80', page:'Jewellery.html', badge:'', addedAt: Date.now()-5000 },
    { id:'sh1', name:'White Sneakers', price:1299, mrp:1799, category:'Footwear', image:'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&q=80', page:'shoes.html', badge:'Sale', addedAt: Date.now()-6000 },
    { id:'k1', name:'Kids Cartoon T-Shirt', price:399, mrp:599, category:'Kids', image:'https://images.unsplash.com/photo-1567113463300-102a7eb3cb26?w=400&q=80', page:'kids.html', badge:'New', addedAt: Date.now()-7000 },
    { id:'wt1', name:'Analog Classic Watch', price:2999, mrp:4500, category:'Men', image:'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&q=80', page:'watches.html', badge:'', addedAt: Date.now()-8000 },
  ];

  function getWishlist() {
    let w = JSON.parse(localStorage.getItem('shopHubWishlist') || 'null');
    if (w === null) {
      // First visit — seed with samples
      localStorage.setItem('shopHubWishlist', JSON.stringify(SAMPLE_WISHLIST));
      return SAMPLE_WISHLIST;
    }
    return w;
  }
  function saveWishlist(w) { localStorage.setItem('shopHubWishlist', JSON.stringify(w)); }

  let activeFilter = 'all';

  // ─── Render ────────────────────────────────────────────────────────────────
  function renderWishlist() {
    let items = getWishlist();

    // Filter
    if (activeFilter !== 'all') items = items.filter(i => i.category === activeFilter);

    // Sort
    const sort = document.getElementById('sort-select').value;
    if (sort === 'price-asc')  items.sort((a,b) => a.price - b.price);
    if (sort === 'price-desc') items.sort((a,b) => b.price - a.price);
    if (sort === 'name')       items.sort((a,b) => a.name.localeCompare(b.name));
    if (sort === 'recent')     items.sort((a,b) => (b.addedAt||0) - (a.addedAt||0));

    const all = getWishlist();
    const grid = document.getElementById('product-grid');
    const empty = document.getElementById('empty-state');
    const actionBar = document.getElementById('action-bar');
    const heroCount = document.getElementById('hero-count');

    heroCount.textContent = `${all.length} item${all.length !== 1 ? 's' : ''} saved`;

    if (items.length === 0) {
      grid.innerHTML = '';
      empty.style.display = 'block';
      actionBar.style.display = 'none';
      return;
    }

    empty.style.display = 'none';
    actionBar.style.display = 'flex';
    document.getElementById('action-bar-info').textContent =
      `Showing ${items.length} of ${all.length} saved item${all.length !== 1 ? 's' : ''}`;

    grid.innerHTML = items.map((item, idx) => {
      const discount = item.mrp ? Math.round((item.mrp - item.price) / item.mrp * 100) : 0;
      return `
        <div class="product-card" style="animation-delay:${idx * 0.05}s" id="card-${item.id}">
          <div class="card-image-wrap">
            <img src="${item.image}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/300x375?text=Image'" loading="lazy">
            ${item.badge ? `<span class="card-badge ${item.badge==='New'?'new':''}">${item.badge}</span>` : ''}
            <button class="heart-btn" onclick="removeFromWishlist('${item.id}', this)" title="Remove from wishlist">
              <i class="fas fa-heart"></i>
            </button>
            <button class="quick-add" onclick="addToCart('${item.id}')">
              <i class="fas fa-shopping-bag" style="margin-right:6px"></i> Quick Add to Cart
            </button>
          </div>
          <div class="card-body">
            <p class="card-category">${item.category}</p>
            <h3 class="card-name">${item.name}</h3>
            <div class="card-price-row">
              <span class="card-price">₹${item.price.toLocaleString('en-IN')}</span>
              ${item.mrp ? `<span class="card-mrp">₹${item.mrp.toLocaleString('en-IN')}</span>` : ''}
              ${discount > 0 ? `<span class="card-discount">${discount}% off</span>` : ''}
            </div>
            <button class="add-to-cart-btn" id="atc-${item.id}" onclick="addToCart('${item.id}')">
              <i class="fas fa-shopping-cart" style="margin-right:6px"></i> Add to Cart
            </button>
          </div>
        </div>
      `;
    }).join('');

    updateCartBadge();
  }

  // ─── Filter ────────────────────────────────────────────────────────────────
  window.setFilter = function(filter, el) {
    activeFilter = filter;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    renderWishlist();
  };

  // ─── Remove from Wishlist ──────────────────────────────────────────────────
  window.removeFromWishlist = function(id, btn) {
    btn.classList.add('removing');
    const card = document.getElementById(`card-${id}`);
    setTimeout(() => {
      card.style.transition = 'opacity 0.3s, transform 0.3s';
      card.style.opacity = '0';
      card.style.transform = 'scale(0.9)';
      setTimeout(() => {
        let w = getWishlist().filter(i => i.id !== id);
        saveWishlist(w);
        renderWishlist();
        showToast('Removed from wishlist');
      }, 300);
    }, 250);
  };

  // ─── Add to Cart ───────────────────────────────────────────────────────────
  window.addToCart = function(id) {
    const item = getWishlist().find(i => i.id === id);
    if (!item) return;
    const cart = JSON.parse(localStorage.getItem('myShopCart') || '[]');
    cart.push({ id: item.id, name: item.name, price: item.price, image: item.image });
    localStorage.setItem('myShopCart', JSON.stringify(cart));
    updateCartBadge();

    const btn = document.getElementById(`atc-${id}`);
    if (btn) {
      btn.classList.add('added');
      btn.innerHTML = '<i class="fas fa-check" style="margin-right:6px"></i> Added!';
      setTimeout(() => {
        btn.classList.remove('added');
        btn.innerHTML = '<i class="fas fa-shopping-cart" style="margin-right:6px"></i> Add to Cart';
      }, 2000);
    }
    showToast('Added to cart ✓');
  };

  // ─── Add All to Cart ───────────────────────────────────────────────────────
  window.addAllToCart = function() {
    const items = getWishlist();
    if (!items.length) return;
    const cart = JSON.parse(localStorage.getItem('myShopCart') || '[]');
    items.forEach(item => cart.push({ id: item.id, name: item.name, price: item.price, image: item.image }));
    localStorage.setItem('myShopCart', JSON.stringify(cart));
    updateCartBadge();
    showToast(`${items.length} items added to cart ✓`);
    setTimeout(() => window.location.href = 'cart.html', 800);
  };

  // ─── Clear All ─────────────────────────────────────────────────────────────
  window.clearWishlist = function() {
    if (!confirm('Remove all items from your wishlist?')) return;
    saveWishlist([]);
    renderWishlist();
    showToast('Wishlist cleared');
  };

  // ─── Toast ─────────────────────────────────────────────────────────────────
  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  // ─── Cart Badge ────────────────────────────────────────────────────────────
  function updateCartBadge() {
    const cart = JSON.parse(localStorage.getItem('myShopCart') || '[]');
    document.getElementById('cart-badge').textContent = cart.length;
  }

  // ─── Expose addToWishlist for other pages ──────────────────────────────────
  // Other product pages can call: ShopHubWishlist.add({ id, name, price, mrp, category, image, page })
  window.ShopHubWishlist = {
    add(item) {
      const w = getWishlist();
      if (!w.find(i => i.id === item.id)) {
        w.unshift({ ...item, badge: item.badge || '', addedAt: Date.now() });
        saveWishlist(w);
        return true;
      }
      return false; // already in wishlist
    },
    remove(id) {
      saveWishlist(getWishlist().filter(i => i.id !== id));
    },
    has(id) {
      return getWishlist().some(i => i.id === id);
    },
    count() {
      return getWishlist().length;
    }
  };

  // ─── Init ──────────────────────────────────────────────────────────────────
  renderWishlist();
</script>
</body>
</html>
