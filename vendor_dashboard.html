<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard | ShopHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 flex">

    <aside class="w-64 bg-white h-screen border-r border-gray-200 p-6">
        <h1 class="text-2xl font-bold text-purple-600 mb-10"><i class="fas fa-shopping-bag"></i> ShopHub</h1>
        <nav class="space-y-4">
            <a href="#" class="flex items-center gap-3 text-purple-600 font-bold"><i class="fas fa-home"></i> Dashboard</a>
        </nav>
    </aside>

    <main class="flex-1 p-8">
        <header class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-bold text-gray-800">Welcome Back, Vendor!</h2>
            <button id="logoutBtn" class="text-red-500 hover:text-red-700 font-semibold text-sm">Logout</button>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <p class="text-gray-500">Total Sales</p>
                <h3 id="totalSalesDisplay" class="text-3xl font-bold">$0.00</h3>
            </div>
        </div>

        <div class="mt-8 bg-white p-8 rounded-xl shadow-sm border border-gray-100">
            <h3 class="text-xl font-bold mb-4">Quick Actions</h3>
            <button id="addProductBtn" class="bg-purple-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-purple-700 transition">
                <i class="fas fa-plus"></i> Add New Product
            </button>
        </div>

        <div class="mt-8">
            <h3 class="text-xl font-bold mb-4">My Inventory</h3>
            <div id="inventoryList" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                </div>
        </div>
    </main>

    <script>
        // 1. Navigation & Logout Logic
        document.getElementById('addProductBtn').addEventListener('click', () => {
            window.location.href = "add_product.html"; 
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            if(confirm("Are you sure you want to log out?")) {
                window.location.href = "login.html";
            }
        });

        // 2. Load Data from LocalStorage
        const inventoryList = document.getElementById('inventoryList');
        const totalSalesDisplay = document.getElementById('totalSalesDisplay');
        const products = JSON.parse(localStorage.getItem('myProducts') || '[]');

        // 3. Render Inventory & Calculate Total
        if (products.length === 0) {
            inventoryList.innerHTML = "<p class='text-gray-500'>No products added yet.</p>";
            totalSalesDisplay.innerText = "$0.00";
        } else {
            inventoryList.innerHTML = '';
            let total = 0;

            products.forEach(p => {
                // Add to total (safely parse the price)
                total += parseFloat(p.price) || 0;

                // Create Card
                const card = document.createElement('div');
                card.className = "bg-white p-6 rounded-xl shadow border border-gray-100";
                card.innerHTML = `
                    <img src="${p.image}" class="h-32 w-full object-cover rounded-lg mb-4" alt="Product Image">
                    <h4 class="font-bold text-lg">${p.title}</h4>
                    <p class="text-sm text-gray-500">Category: ${p.category || 'N/A'}</p>
                    <p class="text-xl font-bold text-green-600">$${parseFloat(p.price).toFixed(2)}</p>
                `;
                inventoryList.appendChild(card);
            });

            // Update Total Sales
            totalSalesDisplay.innerText = "$" + total.toFixed(2);
        }

        const vendorName = localStorage.getItem('vendorName');
    if (vendorName) {
        document.querySelector('h2').innerText = "Welcome Back, " + vendorName + "!";
    }

    // ... (Keep the rest of your existing code below this)
    document.getElementById('addProductBtn').addEventListener('click', () => {
        window.location.href = "add_product.html"; 
    });

    // Replace your old local storage loading code with this
fetch('/api/orders')
    .then(response => response.json())
    .then(data => {
        const inventoryList = document.getElementById('inventoryList');
        inventoryList.innerHTML = ''; // Clear existing content

        data.forEach(order => {
            const card = document.createElement('div');
            card.className = "bg-white p-6 rounded-xl shadow border border-gray-100";
            card.innerHTML = `
                <h4 class="font-bold text-lg">Order ID: ${order._id.slice(-6)}</h4>
                <p class="text-xl font-bold text-green-600">$${order.totalAmount}</p>
                <p class="text-sm text-gray-500">Status: ${order.status}</p>
            `;
            inventoryList.appendChild(card);
        });
    })
    .catch(err => console.error("Error fetching orders:", err));
    </script>
</body>
</html>
