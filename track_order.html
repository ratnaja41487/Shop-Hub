<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Order | ShopHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">

  <section class="container mx-auto px-4 py-12 max-w-4xl">
    <div class="bg-white rounded-3xl shadow-sm border p-8">
      
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 border-b pb-6">
        <div>
          <h2 id="order-id" class="text-xl font-bold text-gray-900">Loading Order...</h2>
          <p id="order-date" class="text-gray-500 text-sm"></p>
        </div>
        <div class="mt-4 md:mt-0 md:text-right">
          <span id="order-status-badge" class="bg-gray-100 text-gray-700 px-4 py-1 rounded-full text-sm font-bold capitalize">Loading...</span>
        </div>
      </div>

      <div class="relative pl-2 space-y-8">
        <div class="absolute left-[27px] top-4 bottom-4 w-0.5 bg-gray-200 z-0"></div>

        <div class="flex gap-6 relative z-10 items-start">
          <div class="flex-shrink-0">
            <div id="step-confirmed" class="w-10 h-10 rounded-full bg-gray-200 text-gray-400 flex items-center justify-center ring-8 ring-white">
              <i class="fas fa-check text-sm"></i>
            </div>
          </div>
          <div>
            <h4 class="font-bold text-gray-900">Order Confirmed</h4>
            <p class="text-sm text-gray-500">Your order has been received.</p>
          </div>
        </div>

        <div class="flex gap-6 relative z-10 items-start">
          <div class="flex-shrink-0">
            <div id="step-shipped" class="w-10 h-10 rounded-full bg-gray-200 text-gray-400 flex items-center justify-center ring-8 ring-white">
              <i class="fas fa-shipping-fast text-sm"></i>
            </div>
          </div>
          <div>
            <h4 class="font-bold text-gray-900">Shipped</h4>
            <p class="text-sm text-gray-500">Package has left the warehouse.</p>
          </div>
        </div>

        <div class="flex gap-6 relative z-10 items-start">
          <div class="flex-shrink-0">
            <div id="step-delivered" class="w-10 h-10 rounded-full bg-gray-200 text-gray-400 flex items-center justify-center ring-8 ring-white">
              <i class="fas fa-home text-sm"></i>
            </div>
          </div>
          <div>
            <h4 class="font-bold text-gray-900">Delivered</h4>
            <p class="text-sm text-gray-500">Arrived at your destination.</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script>
    async function fetchOrder() {
      const urlParams = new URLSearchParams(window.location.search);
      const orderId = urlParams.get('id');

      if (!orderId) return;

      try {
        const response = await fetch(`/orders/${orderId}`);
        const order = await response.json();

        // Populate basic info
        document.getElementById('order-id').textContent = `Order #${order._id.slice(-6).toUpperCase()}`;
        document.getElementById('order-date').textContent = `Placed on ${new Date(order.createdAt).toLocaleDateString()}`;
        document.getElementById('order-status-badge').textContent = order.status;

        // Logic to highlight active steps
        const steps = ['confirmed', 'shipped', 'delivered'];
        const activeIdx = steps.indexOf(order.status);

        steps.forEach((step, index) => {
          const el = document.getElementById(`step-${step}`);
          if (index <= activeIdx) {
            el.classList.replace('bg-gray-200', 'bg-purple-600');
            el.classList.replace('text-gray-400', 'text-white');
          }
        });
      } catch (err) {
        console.error("Failed to fetch order:", err);
      }
    }

    document.addEventListener('DOMContentLoaded', fetchOrder);
  </script>
</body>
</html>
