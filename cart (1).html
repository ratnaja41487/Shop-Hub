<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart | ShopHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .qty-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.15s; }
    .qty-btn:hover { background: #f3e8ff; color: #7c3aed; }
  </style>
</head>
<body class="p-4 md:p-12 text-gray-800 antialiased">

  <div class="max-w-5xl mx-auto mb-8">
    <a href="home.html" class="inline-flex items-center gap-2 text-2xl font-black tracking-tight text-purple-700">
      <i class="fas fa-shopping-bag text-xl"></i> ShopHub
    </a>
  </div>

  <div class="max-w-5xl mx-auto flex flex-col lg:flex-row gap-8 items-start">

    <div class="flex-1 w-full bg-white border border-slate-100 rounded-2xl shadow-sm p-6 md:p-8">
      <div class="flex justify-between items-center border-b border-slate-100 pb-5 mb-6">
        <h1 class="text-xl md:text-2xl font-bold text-slate-900">
          Shopping Cart <span id="item-count-label" class="text-sm font-normal text-slate-400 ml-1"></span>
        </h1>
        <a href="home.html" class="text-sm font-semibold text-purple-600 hover:text-purple-700 transition-colors flex items-center gap-1.5">
          <i class="fas fa-arrow-left text-xs"></i> Keep Shopping
        </a>
      </div>

      <div id="cart-display" class="divide-y divide-slate-100"></div>

      <div id="empty-state" class="hidden text-center py-16">
        <div class="w-16 h-16 bg-slate-50 text-slate-300 rounded-full flex items-center justify-center mx-auto mb-4">
          <i class="fas fa-shopping-cart text-2xl"></i>
        </div>
        <p class="text-slate-500 font-semibold text-base">Your shopping cart feels light!</p>
        <p class="text-slate-400 text-xs mt-1">Add items to get your fashion order rolling.</p>
        <a href="home.html" class="inline-block mt-5 bg-purple-600 text-white px-6 py-2.5 rounded-xl hover:bg-purple-700 transition-all text-xs font-bold shadow-sm shadow-purple-200">
          Browse Collections
        </a>
      </div>
    </div>

    <div id="summary-panel" class="hidden w-full lg:w-80 flex-shrink-0">
      <div class="bg-white border border-slate-100 rounded-2xl shadow-sm p-6 sticky top-6">
        <h2 class="text-base font-bold text-slate-900 mb-4 pb-3 border-b border-slate-100">Order Summary</h2>

        <div class="space-y-3.5 text-xs font-medium text-slate-500 mb-5">
          <div class="flex justify-between">
            <span>Subtotal (<span id="summary-count">0</span> items)</span>
            <span class="font-bold text-slate-800">₹<span id="subtotal">0</span></span>
          </div>
          <div class="flex justify-between items-center">
            <span>Delivery Logistics</span>
            <span id="delivery-cost" class="text-emerald-600 font-bold tracking-wide">FREE</span>
          </div>
          <div class="flex justify-between">
            <span>Platform Discount (10%)</span>
            <span class="text-emerald-600 font-bold">-₹<span id="discount">0</span></span>
          </div>
        </div>

        <div class="flex justify-between items-center text-sm font-bold border-t border-slate-100 pt-4 mb-5">
          <span class="text-slate-800">Total Net Payable</span>
          <span class="text-purple-700 text-xl font-extrabold">₹<span id="total-price">0</span></span>
        </div>

        <div class="mb-5">
          <div class="flex gap-2">
            <input type="text" id="coupon-input" placeholder="Promo or Gift Code" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs outline-none focus:bg-white focus:border-purple-400 focus:ring-1 focus:ring-purple-400 transition-all font-medium">
            <button onclick="applyCoupon()" class="bg-purple-50 text-purple-700 px-4 py-2 rounded-xl text-xs font-bold hover:bg-purple-100 transition-colors">Apply</button>
          </div>
          <p id="coupon-msg" class="text-[11px] mt-1.5 font-semibold"></p>
        </div>

        <a href="checkout.html" class="block">
          <button class="w-full bg-purple-600 text-white py-3.5 rounded-xl font-bold hover:bg-purple-700 active:scale-[0.98] transition-all shadow-sm shadow-purple-200 flex items-center justify-center gap-2 text-sm">
            <i class="fas fa-shield-alt text-xs opacity-80"></i> Proceed to Checkout
          </button>
        </a>

        <div class="mt-4 flex items-center justify-center gap-1.5 text-[10px] font-semibold tracking-wide uppercase text-slate-400">
          <i class="fas fa-lock text-[9px]"></i> 256-Bit SSL Secured Terminal
        </div>
      </div>
    </div>

  </div>

  <script>
    // ─── LocalStorage Access Layer ──────────────────────────────────────────
    function getCart() {
      try {
        return JSON.parse(localStorage.getItem('myShopCart')) || [];
      } catch (e) {
        return [];
      }
    }
    
    function saveCart(cart) {
      localStorage.setItem('myShopCart', JSON.stringify(cart));
    }
    
    // Clean strings and sanitize raw structural data values gracefully
    function parseToNumber(val) {
      if (typeof val === 'number') return val;
      if (!val) return 0;
      // Extract numeric strings safely, ensuring 499 parses clearly
      const clean = val.toString().replace(/[^\d.]/g, '');
      return Math.round(parseFloat(clean)) || 0;
    }

    // ─── Render View Factory ────────────────────────────────────────────────
    function renderCart() {
      const cart = getCart();
      const display = document.getElementById('cart-display');
      const emptyState = document.getElementById('empty-state');
      const summaryPanel = document.getElementById('summary-panel');

      if (cart.length === 0) {
        display.innerHTML = '';
        emptyState.classList.remove('hidden');
        summaryPanel.classList.add('hidden');
        document.getElementById('item-count-label').textContent = '';
        return;
      }

      emptyState.classList.add('hidden');
      summaryPanel.classList.remove('hidden');
      document.getElementById('item-count-label').textContent = `(${cart.length} item${cart.length > 1 ? 's' : ''})`;

      // Structural hash-mapping bucket to collapse matching entries smoothly
      const groups = {};
      cart.forEach((item) => {
        const key = item.id || (item.name + (item.size || ''));
        if (!groups[key]) {
          groups[key] = { 
            ...item, 
            price: parseToNumber(item.price), 
            qty: 0 
          };
        }
        groups[key].qty++;
      });

      display.innerHTML = Object.values(groups).map(group => `
        <div class="flex items-center gap-4 py-5 first:pt-0 last:pb-0">
          <img src="${group.image}" class="w-16 h-16 md:w-20 md:h-20 object-cover rounded-xl bg-slate-50 border border-slate-100 flex-shrink-0" onerror="this.src='https://via.placeholder.com/80'">
          <div class="flex-1 min-w-0">
            <h3 class="font-bold text-slate-800 text-sm leading-tight truncate">${group.name}</h3>
            ${group.size ? `<span class="inline-flex mt-1 text-[10px] font-bold bg-slate-50 border border-slate-100 text-slate-500 px-2 py-0.5 rounded-md">Size: ${group.size}</span>` : ''}
            <p class="text-purple-600 font-extrabold text-sm mt-1.5">₹${group.price.toLocaleString('en-IN')}</p>
          </div>
          <div class="flex flex-col items-end gap-2 flex-shrink-0">
            <div class="flex items-center border border-slate-200 rounded-xl overflow-hidden bg-white shadow-xs">
              <button class="qty-btn text-slate-400 hover:bg-slate-50" onclick="changeQty('${group.id || (group.name + (group.size || ''))}', -1)">−</button>
              <span class="w-7 text-center text-xs font-bold text-slate-700">${group.qty}</span>
              <button class="qty-btn text-slate-400 hover:bg-slate-50" onclick="changeQty('${group.id || (group.name + (group.size || ''))}', 1)">+</button>
            </div>
            <p class="text-[11px] font-medium text-slate-400">₹${(group.price * group.qty).toLocaleString('en-IN')} total</p>
            <button onclick="removeGroup('${group.id || (group.name + (group.size || ''))}')" class="text-red-400 hover:text-red-600 text-xs font-semibold flex items-center gap-1 transition-colors mt-0.5">
              <i class="fas fa-trash-alt text-[10px]"></i> Remove
            </button>
          </div>
        </div>
      `).join('');

      updateSummary(groups);
    }

    // ─── Operational Mathematical Financial Modules ────────────────────────
    let extraDiscount = 0;
    function updateSummary(groups) {
      const itemsArray = Object.values(groups);
      
      let subtotal = 0;
      let totalItems = 0;
      
      itemsArray.forEach(item => {
        subtotal += item.price * item.qty;
        totalItems += item.qty;
      });

      // Free shipping triggered across India for order purchases exceeding ₹499
      const delivery = subtotal > 499 || subtotal === 0 ? 0 : 49;
      const discount = Math.round(subtotal * 0.10) + extraDiscount;
      const total = Math.max(0, (subtotal + delivery) - discount);

      document.getElementById('summary-count').textContent = totalItems;
      document.getElementById('subtotal').textContent = subtotal.toLocaleString('en-IN');
      
      const deliveryLabel = document.getElementById('delivery-cost');
      if (delivery === 0) {
        deliveryLabel.textContent = 'FREE';
        deliveryLabel.className = 'text-emerald-600 font-bold tracking-wide';
      } else {
        deliveryLabel.textContent = `₹${delivery}`;
        deliveryLabel.className = 'text-slate-800 font-bold';
      }
      
      document.getElementById('discount').textContent = discount.toLocaleString('en-IN');
      document.getElementById('total-price').textContent = total.toLocaleString('en-IN');
    }

    // ─── Mutators & Event Receivers ─────────────────────────────────────────
    window.changeQty = function(key, delta) {
      let cart = getCart();
      const idx = cart.findIndex(item => (item.id || (item.name + (item.size || ''))) === key);

      if (idx > -1) {
        if (delta === -1) {
          cart.splice(idx, 1);
        } else if (delta === 1) {
          cart.push({ ...cart[idx] });
        }
        saveCart(cart);
        renderCart();
      }
    };

    window.removeGroup = function(key) {
      let cart = getCart().filter(item => (item.id || (item.name + (item.size || ''))) !== key);
      saveCart(cart);
      renderCart();
    };

    const COUPONS = { SAVE50: 50, SHOPHUB20: 20, WELCOME100: 100 };
    window.applyCoupon = function() {
      const code = document.getElementById('coupon-input').value.trim().toUpperCase();
      const msg = document.getElementById('coupon-msg');
      
      if (COUPONS[code]) {
        extraDiscount = COUPONS[code];
        msg.textContent = `✓ Promo applied: ₹${COUPONS[code]} savings unlocked!`;
        msg.className = 'text-[11px] mt-1.5 text-emerald-600 font-bold';
        renderCart();
      } else {
        msg.textContent = 'Invalid code. Try SAVE50 or WELCOME100.';
        msg.className = 'text-[11px] mt-1.5 text-rose-500 font-semibold';
      }
    };

    // Initialize View Lifecycle
    document.addEventListener('DOMContentLoaded', renderCart);
  </script>
</body>
</html>
