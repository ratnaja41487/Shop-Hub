<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Men Fashion - Jackets Collection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff;
            color: #000;
        }

        /* --- Navbar --- */
        .navbar {
            background-color: #fff;
            padding: 20px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f0f0f0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 2.5px;
            color: #000;
            text-decoration: none;
        }

        .nav-icons {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        /* Search Bar Styles */
        .search-container {
            display: flex;
            align-items: center;
            position: relative;
        }

        #search-input {
            width: 0;
            padding: 0;
            border: none;
            outline: none;
            transition: width 0.4s ease, padding 0.4s ease;
            font-family: 'Montserrat', sans-serif;
            border-bottom: 1px solid #000;
            background: transparent;
        }

        #search-input.active {
            width: 200px;
            padding: 5px 10px;
            margin-right: 10px;
        }

        .icon {
            text-decoration: none;
            color: #000;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .cart-icon {
            position: relative;
            text-decoration: none;
        }

        .cart-count {
            position: absolute;
            top: -7px;
            right: -10px;
            background-color: #000;
            color: #fff;
            border-radius: 50%;
            font-size: 10px;
            width: 18px;
            height: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        /* --- Page Header --- */
        .page-header {
            text-align: center;
            padding: 60px 0 50px 0;
        }

        .page-title {
            font-size: 38px;
            font-weight: 700;
            letter-spacing: 2px;
            margin: 0 0 10px 0;
        }

        /* --- Product Grid --- */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 40px;
            padding: 0 60px 80px 60px;
            min-height: 400px;
        }

        .product-card {
            background-color: #fff;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Hidden class for search results */
        .hidden {
            display: none !important;
        }

        .product-image-container {
            width: 100%;
            background-color: #f7f7f7;
            border-radius: 4px;
            aspect-ratio: 1 / 1.2; 
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .product-card:hover .product-image {
            transform: scale(1.1);
        }

        .hover-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 0;
            gap: 10px;
            transform: translateY(100%);
            transition: transform 0.4s ease, opacity 0.3s ease;
            opacity: 0;
            z-index: 2; /* Ensures overlay sits safely on top of image links */
        }

        .product-card:hover .hover-overlay {
            transform: translateY(0);
            opacity: 1;
        }

        .size-box {
            border: 1px solid #ddd;
            padding: 5px 10px;
            font-size: 11px;
            cursor: pointer;
            transition: 0.3s;
        }

        .size-box.selected {
            background-color: #000;
            color: #fff;
        }

        .add-cart-btn {
            background-color: #000;
            color: #fff;
            border: none;
            padding: 12px;
            cursor: pointer;
            width: 85%;
        }

        /* Product Link Styling */
        .product-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }
        
        .product-link:hover .product-name {
            text-decoration: underline;
        }

        @media (max-width: 1024px) { .product-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .product-grid { grid-template-columns: 1fr; } }
    </style>
</head>
