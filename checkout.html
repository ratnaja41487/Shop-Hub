<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | ShopHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
    .step-active { background: #7c3aed; color: white; }
    .step-done { background: #10b981; color: white; }
    .step-inactive { background: #e5e7eb; color: #9ca3af; }
    .input-field { width: 100%; border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px 16px; font-size: 14px; outline: none; transition: border-color 0.2s; }
    .input-field:focus { border-color: #7c3aed; box-shadow: 0 0 0 3px rgba(124,58,237,0.08); }
    .payment-option { border: 2px solid #e5e7eb; border-radius: 12px; padding: 14px 18px; cursor: pointer; transition: border-color 0.2s, background 0.2s; }
    .payment-option:hover { border-color: #c4b5fd; }
    .payment-option.selected { border-color: #7c3aed; background: #faf5ff; }
    #success-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
    #success-overlay.show { display: flex; }
    @keyframes popIn { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .success-card { animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1); }
  </style>
</head>
<body>

  <header class="bg-white border-b sticky top-0 z-50 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="home.html" class="text-xl font-bold text-purple-700 flex items-center gap-2">
        <i class="fas fa-shopping-bag"></i> ShopHub
      </a>
      <div class="flex items-center gap-2 text-sm text-gray-500">
        <i class="fas fa-lock text-green-500"></i>
        <span>Secure Checkout</span>
      </div>
    </div>
  </header>

  <div class="max-w-5xl mx-auto px-4 py-6">
    <div class="flex items-center justify-center gap-0 mb-8">
      <div class="flex items-center gap-2">
        <div id="step1-circle" class="step-active w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold">1</div>
        <span id="step1-label" class="text-sm font-semibold text-purple-700">Address</span>
      </div>
      <div class="w-12 h-0.5 bg-gray-200 mx-2" id="line1"></div>
      <div class="flex items-center gap-2">
        <div id="step2-circle" class="step-inactive w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold">2</div>
        <span id="step2-label" class="text-sm font-semibold text-gray-400">Payment</span>
      </div>
      <div class="w-12 h-0.5 bg-gray-200 mx-2" id="line2"></div>
      <div class="flex items-center gap-2">
        <div id="step3-circle" class="step-inactive w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold">3</div>
        <span id="step3-label" class="text-sm font-semibold text-gray-400">Review</span>
      </div>
    </div>

    <div class="flex flex-col lg:flex-row gap-8">
      <div class="flex-1">
        <div id="panel-1" class="bg-white rounded-2xl shadow-sm p-6 md:p-8">
          <h2 class="text-xl font-bold text-gray-900 mb-6 flex items-center gap-2">
            <i class="fas fa-map-marker-alt text-purple-600"></i> Delivery Address
          </h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div><label class="block text-sm font-medium text-gray-700 mb-1">First Name *</label><input type="text" id="fname" class="input-field"></div>
            <div><label class="block text-sm font-medium text-gray-700 mb-1">Last Name *</label><input type="text" id="lname" class="input-field"></div>
            <div class="md:col-span-2"><label class="block text-sm font-medium text-gray-700 mb-1">Phone Number *</label><input type="tel" id="phone" class="input-field"></div>
            <div class="md:col-span-2"><label class="block text-sm font-medium text-gray-700 mb-1">Address Line 1 *</label><input type="text" id="addr1" class="input-field"></div>
            <div class="md:col-span-2"><label class="block text-sm font-medium text-gray-700 mb-1">Address Line 2</label><input type="text" id="addr2" class="input-field"></div>
            <div><label class="block text-sm font-medium text-gray-700 mb-1">City *</label><input type="text" id="city" class="input-field"></div>
            <div><label class="block text-sm font-medium text-gray-700 mb-1">State *</label><select id="state" class="input-field bg-white"><option value="">Select State</option><option>Andhra Pradesh</option><option>Telangana</option><option>Karnataka</option><option>Tamil Nadu</option><option>Maharashtra</option></select></div>
            <div><label class="block text-sm font-medium text-gray-700 mb-1">PIN Code *</label><input type="text" id="pin" class="input-field" maxlength="6"></div>
          </div>
          <p id="addr-error" class="text-red-500 text-sm mt-3 hidden">Please fill all required fields.</p>
          <button onclick="goToStep(2)" class="mt-6 w-full bg-purple-600 text-white py-3 rounded-xl font-bold hover:bg-purple-700 transition-all">Continue to Payment <i class="fas fa-arrow-right ml-2"></i></button>
        </div>

        <div id="panel-2" class="hidden bg-white rounded-2xl shadow-sm p-6 md:p-8">
          <h2 class="text-xl font-bold text-gray-900 mb-6 flex items-center gap-2"><i class="fas fa-credit-card text-purple-600"></i> Payment Method</h2>
          <div class="space-y-3 mb-6">
            <div class="payment-option selected" onclick="selectPayment(this,'upi')"><p class="font-semibold text-sm">UPI</p></div>
            <div class="payment-option" onclick="selectPayment(this,'cod')"><p class="font-semibold text-sm">Cash on Delivery</p></div>
          </div>
          <div class="flex gap-3">
            <button onclick="goToStep(1)" class="flex-1 border text-gray-700 py-3 rounded-xl font-bold">Back</button>
            <button onclick="goToStep(3)" class="flex-1 bg-purple-600 text-white py-3 rounded-xl font-bold">Review Order</button>
          </div>
        </div>

        <div id="panel-3" class="hidden bg-white rounded-2xl shadow-sm p-6 md:p-8">
          <h2 class="text-xl font-bold text-gray-900 mb-6">Review & Place Order</h2>
          <div id="review-items" class="space-y-3 mb-6"></div>
          <div class="text-base font-bold text-gray-900 pt-2 border-t">Total: ₹<span id="r-total">0</span></div>
          <button id="place-order-btn" onclick="placeOrder()" class="mt-6 w-full bg-green-600 text-white py-3 rounded-xl font-bold hover:bg-green-700">Place Order</button>
        </div>
      </div>
    </div>
  </div>

  <div id="success-overlay">
    <div class="success-card bg-white rounded-3xl p-10 max-w-sm text-center">
      <h2 class="text-2xl font-extrabold text-gray-900 mb-2">Order Placed!</h2>
      <p>Thank you for shopping with ShopHub 🎉</p>
      <a href="home.html" class="block mt-6 bg-purple-600 text-white py-3 rounded-xl font-bold">Continue Shopping</a>
    </div>
  </div>

  <script>
    let cart = JSON.parse(localStorage.getItem('myShopCart')) || [];
    let selectedPaymentMethod = 'upi';
    let addressData = {};

    function groupCart(cart) {
      const groups = {};
      cart.forEach(item => {
        const k = item.id || item.name;
        if (!groups[k]) groups[k] = { ...item, qty: 0 };
        groups[k].qty++;
      });
      return Object.values(groups);
    }

    function calcTotals(groups) {
      const subtotal = groups.reduce((s, g) => s + parseFloat(g.price) * g.qty, 0);
      return { subtotal, total: subtotal }; // Simplified for demo
    }

    function goToStep(n) {
      [1, 2, 3].forEach(i => document.getElementById(`panel-${i}`).classList.toggle('hidden', i !== n));
      if(n === 3) populateReview();
    }

    function selectPayment(el, method) {
      document.querySelectorAll('.payment-option').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
      selectedPaymentMethod = method;
    }

    function populateReview() {
      const groups = groupCart(cart);
      const { total } = calcTotals(groups);
      document.getElementById('r-total').textContent = total;
    }

    async function placeOrder() {
      const groups = groupCart(cart);
      const { total } = calcTotals(groups);
      
      const orderPayload = {
        items: groups.map(g => ({
          productName: g.name,
          price: g.price,
          quantity: g.qty
        })),
        totalAmount: total,
        shippingAddress: `${document.getElementById('addr1').value}, ${document.getElementById('city').value}`
      };

      try {
        const response = await fetch('http://localhost:5000/api/orders/add', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(orderPayload)
        });

        if (response.ok) {
          localStorage.removeItem('myShopCart');
          document.getElementById('success-overlay').classList.add('show');
        } else {
          alert('Failed to place order. Please try again.');
        }
      } catch (err) {
        console.error('Error:', err);
        alert('Server unreachable. Make sure server.js is running.');
      }
    }
  </script>
</body>
</html>
