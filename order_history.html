<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders | ShopHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background: #f9fafb; }
    .status-confirmed  { background:#ede9fe; color:#7c3aed; }
    .status-shipped    { background:#dbeafe; color:#1d4ed8; }
    .status-delivered  { background:#dcfce7; color:#15803d; }
    .status-cancelled  { background:#fee2e2; color:#b91c1c; }
    .tab-active { border-bottom: 3px solid #7c3aed; color: #7c3aed; font-weight: 700; }
    .order-card { transition: box-shadow 0.2s; }
    .order-card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.09); }
  </style>
</head>
<body>

<!-- Navbar -->
<header class="bg-white border-b sticky top-0 z-50 shadow-sm">
  <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
    <a href="home.html" class="text-xl font-bold text-purple-700 flex items-center gap-2">
      <i class="fas fa-shopping-bag"></i> ShopHub
    </a>
    <nav class="flex items-center gap-5 text-sm text-gray-600">
      <a href="profile.html" class="hover:text-purple-600"><i class="fas fa-user mr-1"></i>Profile</a>
      <a href="wishlist.html" class="hover:text-purple-600"><i class="fas fa-heart mr-1"></i>Wishlist</a>
      <a href="cart.html" class="relative hover:text-purple-600">
        <i class="fas fa-shopping-cart text-xl"></i>
        <span id="cart-badge" class="absolute -top-2 -right-2 bg-purple-600 text-white text-[10px] rounded-full h-4 w-4 flex items-center justify-center">0</span>
      </a>
    </nav>
  </div>
</header>

<div class="max-w-5xl mx-auto px-4 py-8">

  <!-- Page Title -->
  <div class="mb-6">
    <h1 class="text-2xl font-extrabold text-gray-900">My Orders</h1>
    <p class="text-sm text-gray-500 mt-1">Track, return or buy your items again</p>
  </div>

  <!-- Tabs -->
  <div class="flex gap-6 border-b mb-6 text-sm text-gray-500">
    <button class="pb-3 tab-active" onclick="filterOrders('all', this)">All Orders</button>
    <button class="pb-3 hover:text-purple-600 transition-colors" onclick="filterOrders('confirmed', this)">Confirmed</button>
    <button class="pb-3 hover:text-purple-600 transition-colors" onclick="filterOrders('shipped', this)">Shipped</button>
    <button class="pb-3 hover:text-purple-600 transition-colors" onclick="filterOrders('delivered', this)">Delivered</button>
    <button class="pb-3 hover:text-purple-600 transition-colors" onclick="filterOrders('cancelled', this)">Cancelled</button>
  </div>

  <!-- Search Orders -->
  <div class="flex items-center bg-white border border-gray-200 rounded-xl px-4 py-2.5 gap-3 mb-6 max-w-sm shadow-sm">
    <i class="fas fa-search text-gray-400 text-sm"></i>
    <input type="text" id="order-search" placeholder="Search by order ID or product..." oninput="searchOrders(this.value)"
      class="bg-transparent flex-grow outline-none text-sm text-gray-700 placeholder-gray-400">
  </div>

  <!-- Orders List -->
  <div id="orders-list" class="space-y-4"></div>

  <!-- Empty State -->
  <div id="empty-state" class="hidden text-center py-20">
    <div class="text-6xl mb-4">📦</div>
    <h3 class="text-xl font-bold text-gray-700 mb-2">No orders found</h3>
    <p class="text-gray-400 text-sm mb-6">Looks like you haven't placed any orders yet.</p>
    <a href="home.html" class="bg-purple-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-purple-700 transition-all text-sm">
      Start Shopping
    </a>
  </div>

</div>

<!-- Order Detail Modal -->
<div id="modal-overlay" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" onclick="closeModal(event)">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto" id="modal-content">
    <div class="flex items-center justify-between p-6 border-b">
      <h2 class="font-bold text-gray-900 text-lg">Order Details</h2>
      <button onclick="document.getElementById('modal-overlay').classList.add('hidden')" class="text-gray-400 hover:text-gray-600 text-xl">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div id="modal-body" class="p-6"></div>
  </div>
</div>

<script>
  let allOrders = [];
  let activeFilter = 'all';

  // ─── Load & Seed Data ──────────────────────────────────────────────────────
  function loadOrders() {
    allOrders = JSON.parse(localStorage.getItem('shopHubOrders') || '[]');

    // Seed demo orders if empty (so page isn't blank for new users)
    if (allOrders.length === 0) {
      const demo = [
        {
          id: 'SH78432910', date: new Date(Date.now() - 2*86400000).toISOString(),
          items: [{ name: 'Classic White Shirt', price: 699, qty: 2, size: 'M', image: 'Assets/shirt10.webp' },
                  { name: 'Slim Fit Pants', price: 999, qty: 1, size: 'L', image: 'https://images.unsplash.com/photo-1542272604-787c3835535d?w=80' }],
          address: { name: 'Ravi Kumar', city: 'Hyderabad', state: 'Telangana', pin: '500001' },
          payment: 'upi', total: 2097, status: 'shipped',
          deliveryDate: new Date(Date.now() + 3*86400000).toISOString()
        },
        {
          id: 'SH65219847', date: new Date(Date.now() - 10*86400000).toISOString(),
          items: [{ name: 'Wireless Earbuds', price: 1999, qty: 1, size: '', image: 'https://images.unsplash.com/photo-1606220945770-b5b6c2c55bf1?w=80' }],
          address: { name: 'Ravi Kumar', city: 'Hyderabad', state: 'Telangana', pin: '500001' },
          payment: 'card', total: 1799, status: 'delivered',
          deliveryDate: new Date(Date.now() - 3*86400000).toISOString()
        },
        {
          id: 'SH44128763', date: new Date(Date.now() - 20*86400000).toISOString(),
          items: [{ name: 'Gold Necklace Set', price: 4999, qty: 1, size: '', image: 'https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?w=80' }],
          address: { name: 'Ravi Kumar', city: 'Hyderabad', state: 'Telangana', pin: '500001' },
          payment: 'cod', total: 4999, status: 'confirmed',
          deliveryDate: new Date(Date.now() + 7*86400000).toISOString()
        }
      ];
      localStorage.setItem('shopHubOrders', JSON.stringify(demo));
      allOrders = demo;
    }
  }

  // ─── Render ────────────────────────────────────────────────────────────────
  function renderOrders(orders) {
    const list = document.getElementById('orders-list');
    const empty = document.getElementById('empty-state');

    if (orders.length === 0) {
      list.innerHTML = '';
      empty.classList.remove('hidden');
      return;
    }
    empty.classList.add('hidden');

    list.innerHTML = orders.map(order => {
      const date = new Date(order.date).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
      const delivDate = new Date(order.deliveryDate).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
      const statusLabel = order.status.charAt(0).toUpperCase() + order.status.slice(1);
      const previewItems = order.items.slice(0, 3);
      const extraCount = order.items.length - 3;

      return `
        <div class="order-card bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100">
          <!-- Order Header -->
          <div class="flex flex-wrap items-center justify-between px-5 py-4 border-b gap-3">
            <div class="flex items-center gap-4">
              <div>
                <p class="text-xs text-gray-400">Order ID</p>
                <p class="font-bold text-gray-800 text-sm">#${order.id}</p>
              </div>
              <div>
                <p class="text-xs text-gray-400">Placed on</p>
                <p class="font-semibold text-gray-700 text-sm">${date}</p>
              </div>
              <div>
                <p class="text-xs text-gray-400">${order.status === 'delivered' ? 'Delivered' : 'Expected by'}</p>
                <p class="font-semibold text-gray-700 text-sm">${delivDate}</p>
              </div>
            </div>
            <div class="flex items-center gap-3">
              <span class="status-${order.status} px-3 py-1 rounded-full text-xs font-bold">${statusLabel}</span>
              <span class="font-bold text-purple-700">₹${order.total?.toLocaleString('en-IN')}</span>
            </div>
          </div>

          <!-- Items Preview -->
          <div class="px-5 py-4 flex items-center gap-4">
            <div class="flex -space-x-3">
              ${previewItems.map(item => `
                <img src="${item.image}" class="w-14 h-14 rounded-xl object-cover border-2 border-white bg-gray-100"
                  onerror="this.src='https://via.placeholder.com/56'">
              `).join('')}
              ${extraCount > 0 ? `<div class="w-14 h-14 rounded-xl bg-purple-100 border-2 border-white flex items-center justify-center text-purple-600 font-bold text-sm">+${extraCount}</div>` : ''}
            </div>
            <div class="flex-1">
              <p class="text-sm font-semibold text-gray-900">${order.items[0].name}${order.items.length > 1 ? ` + ${order.items.length - 1} more` : ''}</p>
              <p class="text-xs text-gray-500 mt-0.5">${order.items.reduce((s,i) => s + i.qty, 0)} item(s) · via ${payLabel(order.payment)}</p>
            </div>
          </div>

          <!-- Tracking Bar (if not cancelled) -->
          ${order.status !== 'cancelled' ? `
          <div class="px-5 pb-4">
            ${trackingBar(order.status)}
          </div>` : ''}

          <!-- Actions -->
          <div class="flex flex-wrap gap-2 px-5 py-3 bg-gray-50 border-t">
            <button onclick="openModal('${order.id}')" class="text-sm font-bold text-purple-600 border border-purple-200 px-4 py-2 rounded-lg hover:bg-purple-50 transition-colors">
              <i class="fas fa-eye mr-1"></i> View Details
            </button>
            ${order.status === 'delivered' ? `
            <button onclick="reorder('${order.id}')" class="text-sm font-bold text-white bg-purple-600 px-4 py-2 rounded-lg hover:bg-purple-700 transition-colors">
              <i class="fas fa-redo mr-1"></i> Buy Again
            </button>` : ''}
            ${order.status === 'confirmed' ? `
            <button onclick="cancelOrder('${order.id}')" class="text-sm font-bold text-red-500 border border-red-200 px-4 py-2 rounded-lg hover:bg-red-50 transition-colors">
              <i class="fas fa-times mr-1"></i> Cancel Order
            </button>` : ''}
            <a href="track-order.html?id=${order.id}" class="text-sm font-bold text-gray-600 border border-gray-200 px-4 py-2 rounded-lg hover:bg-gray-100 transition-colors">
              <i class="fas fa-truck mr-1"></i> Track
            </a>
          </div>
        </div>
      `;
    }).join('');
  }

  function trackingBar(status) {
    const steps = ['confirmed','shipped','delivered'];
    const idx = steps.indexOf(status);
    return `
      <div class="flex items-center gap-0 mt-1">
        ${steps.map((s, i) => `
          <div class="flex items-center gap-1 flex-1 ${i < steps.length-1 ? '' : ''}">
            <div class="flex flex-col items-center">
              <div class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
                ${i <= idx ? 'bg-purple-600 text-white' : 'bg-gray-200 text-gray-400'}">
                ${i < idx ? '<i class="fas fa-check text-xs"></i>' : i+1}
              </div>
              <p class="text-xs mt-1 ${i <= idx ? 'text-purple-600 font-semibold' : 'text-gray-400'} whitespace-nowrap">
                ${s.charAt(0).toUpperCase()+s.slice(1)}
              </p>
            </div>
            ${i < steps.length-1 ? `<div class="flex-1 h-0.5 mb-4 mx-1 ${i < idx ? 'bg-purple-600' : 'bg-gray-200'}"></div>` : ''}
          </div>
        `).join('')}
      </div>`;
  }

  function payLabel(p) {
    return { upi:'UPI', card:'Card', netbanking:'Net Banking', cod:'COD' }[p] || p;
  }

  // ─── Filter & Search ───────────────────────────────────────────────────────
  window.filterOrders = function(status, el) {
    activeFilter = status;
    document.querySelectorAll('.tab-active').forEach(t => {
      t.classList.remove('tab-active');
      t.classList.add('text-gray-500');
    });
    el.classList.add('tab-active');
    el.classList.remove('text-gray-500');
    applyFilters();
  };

  window.searchOrders = function(q) {
    applyFilters(q);
  };

  function applyFilters(q = document.getElementById('order-search').value) {
    let filtered = allOrders;
    if (activeFilter !== 'all') filtered = filtered.filter(o => o.status === activeFilter);
    if (q.trim()) {
      const lq = q.toLowerCase();
      filtered = filtered.filter(o =>
        o.id.toLowerCase().includes(lq) ||
        o.items.some(i => i.name.toLowerCase().includes(lq))
      );
    }
    renderOrders(filtered);
  }

  // ─── Modal ─────────────────────────────────────────────────────────────────
  window.openModal = function(orderId) {
    const order = allOrders.find(o => o.id === orderId);
    if (!order) return;
    const date = new Date(order.date).toLocaleDateString('en-IN', { day:'numeric', month:'long', year:'numeric' });
    const delivDate = new Date(order.deliveryDate).toLocaleDateString('en-IN', { day:'numeric', month:'long', year:'numeric' });

    document.getElementById('modal-body').innerHTML = `
      <div class="space-y-4">
        <div class="flex justify-between text-sm">
          <div><p class="text-gray-400 text-xs">Order ID</p><p class="font-bold">#${order.id}</p></div>
          <div class="text-right"><p class="text-gray-400 text-xs">Status</p>
            <span class="status-${order.status} px-2 py-0.5 rounded-full text-xs font-bold">
              ${order.status.charAt(0).toUpperCase()+order.status.slice(1)}
            </span>
          </div>
        </div>
        <div class="text-sm"><p class="text-gray-400 text-xs mb-1">Ordered on</p><p class="font-semibold">${date}</p></div>

        <div class="border-t pt-4">
          <p class="text-xs font-bold text-gray-500 uppercase mb-3">Items</p>
          <div class="space-y-3">
            ${order.items.map(item => `
              <div class="flex items-center gap-3">
                <img src="${item.image}" class="w-14 h-14 rounded-xl object-cover bg-gray-100"
                  onerror="this.src='https://via.placeholder.com/56'">
                <div class="flex-1">
                  <p class="font-semibold text-sm text-gray-900">${item.name}</p>
                  ${item.size ? `<p class="text-xs text-gray-500">Size: ${item.size}</p>` : ''}
                  <p class="text-xs text-gray-500">Qty: ${item.qty}</p>
                </div>
                <p class="font-bold text-purple-700 text-sm">₹${(item.price * item.qty).toLocaleString('en-IN')}</p>
              </div>
            `).join('')}
          </div>
        </div>

        <div class="border-t pt-4">
          <p class="text-xs font-bold text-gray-500 uppercase mb-2">Delivery Address</p>
          <p class="text-sm font-semibold text-gray-800">${order.address?.name || ''}</p>
          <p class="text-sm text-gray-600">${order.address?.addr1 || ''}</p>
          <p class="text-sm text-gray-600">${order.address?.city || ''}, ${order.address?.state || ''} - ${order.address?.pin || ''}</p>
        </div>

        <div class="border-t pt-4">
          <p class="text-xs font-bold text-gray-500 uppercase mb-2">Payment</p>
          <p class="text-sm font-semibold text-gray-800">${payLabel(order.payment)}</p>
        </div>

        <div class="border-t pt-4 flex justify-between font-bold text-gray-900">
          <span>Total Paid</span>
          <span class="text-purple-700 text-lg">₹${order.total?.toLocaleString('en-IN')}</span>
        </div>

        <div class="bg-purple-50 rounded-xl p-3 text-sm text-purple-700 flex items-center gap-2">
          <i class="fas fa-truck"></i>
          <span>${order.status === 'delivered' ? 'Delivered on ' + delivDate : 'Expected by ' + delivDate}</span>
        </div>
      </div>
    `;
    document.getElementById('modal-overlay').classList.remove('hidden');
  };

  window.closeModal = function(e) {
    if (e.target.id === 'modal-overlay') document.getElementById('modal-overlay').classList.add('hidden');
  };

  // ─── Actions ───────────────────────────────────────────────────────────────
  window.cancelOrder = function(orderId) {
    if (!confirm('Are you sure you want to cancel this order?')) return;
    allOrders = allOrders.map(o => o.id === orderId ? { ...o, status: 'cancelled' } : o);
    localStorage.setItem('shopHubOrders', JSON.stringify(allOrders));
    applyFilters();
  };

  window.reorder = function(orderId) {
    const order = allOrders.find(o => o.id === orderId);
    if (!order) return;
    const cart = JSON.parse(localStorage.getItem('myShopCart') || '[]');
    order.items.forEach(item => {
      for (let i = 0; i < item.qty; i++) cart.push({ id: item.id || Date.now(), name: item.name, price: item.price, image: item.image, size: item.size });
    });
    localStorage.setItem('myShopCart', JSON.stringify(cart));
    window.location.href = 'cart.html';
  };

  // ─── Cart Badge ────────────────────────────────────────────────────────────
  function updateCartBadge() {
    const cart = JSON.parse(localStorage.getItem('myShopCart') || '[]');
    document.getElementById('cart-badge').textContent = cart.length;
  }

  // ─── Init ──────────────────────────────────────────────────────────────────
  loadOrders();
  renderOrders(allOrders);
  updateCartBadge();
</script>
</body>
</html>
